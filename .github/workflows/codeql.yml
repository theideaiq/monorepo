name: CodeQL

# Static security analysis of the TypeScript and the workflows; findings
# appear under Security → Code scanning. Free on a public repository (a
# private one needs GitHub Code Security). Replaces the "default setup",
# which must be switched off (Settings → Code security → CodeQL analysis).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 03:40 UTC on Mondays is 6:40 AM in Baghdad.
    - cron: "40 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
