name: Import The IDEA Club content

# Loads the articles in packages/database/supabase/content/posts into the
# production database, one post per file, in order. Data only, never schema;
# every file upserts its post by slug (keeping the publication date and cover
# image) and marks its Telegram news item as sent, so an import doesn't flood
# The IDEA Club. Running it again overwrites the text of those posts.
# Run it by hand: Actions → "Import The IDEA Club content" → Run.
# Uses the same `production` environment secrets as migrate.yml.

on:
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    name: Import content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD to the production environment and the SUPABASE_PROJECT_REF variable."
            exit 1
          fi
      - name: Link the project
        working-directory: packages/database
        run: bunx supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Import
        working-directory: packages/database
        run: |
          set -euo pipefail
          for file in supabase/content/posts/*.sql; do
            echo "::group::$file"
            bunx supabase db query --linked -f "$file"
            echo "::endgroup::"
          done
      - name: Count
        working-directory: packages/database
        run: bunx supabase db query --linked "select section, count(*) from public.posts where published_at is not null group by section order by section"
