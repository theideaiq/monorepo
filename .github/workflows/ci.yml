name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Integrations are optional at build time; real keys live in Vercel.
  SKIP_ENV_VALIDATION: "true"
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_WEB_URL: http://localhost:3001
  NEXT_PUBLIC_API_URL: http://localhost:3002
  NEXT_PUBLIC_STAFF_URL: http://localhost:3003
  TURBO_TELEMETRY_DISABLED: "1"
  # Vercel Remote Cache: unchanged packages are not rebuilt or re-tested.
  # Inactive until TURBO_TOKEN (secret) and TURBO_TEAM (variable) are set.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # New or updated packages with known vulnerabilities fail the PR.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      # A squash merge's message carries every commit message of the pull
      # request; a workflow skip marker in any of them would skip CI, the
      # production migration and the deployments on main.
      - name: Commit messages carry no workflow skip marker
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/${{ github.repository }}/pulls/$PR/commits" --paginate --jq '.[].commit.message' \
            | grep -Eiq '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]'; then
            echo "A commit message in this pull request contains a workflow skip marker. Reword it before merging."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Known vulnerabilities in the lockfile (high or critical) fail the build.
      - run: bun audit --audit-level=high
      - run: bun run check
      - run: bunx turbo boundaries
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run check:placeholders
      - run: bun run check:rtl
      - run: bun run check:i18n
      - run: bun run check:secrets
      - run: bun run check:unused
      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/cobertura-coverage.xml
          retention-days: 14

  build:
    name: Build apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Bun installs and runs scripts; Next.js itself runs on Node.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bunx turbo build --filter=api --filter=partners --filter=staff --filter=web
      # No secret may reach a browser bundle: the client chunks must not
      # contain the secret-key prefix or a server-only variable name. Every
      # directory must exist, or the check is not checking anything.
      - name: No secrets in client bundles
        run: |
          set -e
          dirs="apps/partners/.next/static apps/staff/.next/static apps/staff/public/design apps/web/.next/static apps/api/.next/static"
          for dir in $dirs; do
            test -d "$dir" || { echo "Missing $dir"; exit 1; }
          done
          if grep -rqE "sb_secret_[A-Za-z0-9_-]{8,}|SUPABASE_SECRET_KEY|RESEND_TOKEN|CRON_SECRET|TELEGRAM_BOT_TOKEN|TELEGRAM_WEBHOOK_SECRET|WAYL_API_TOKEN|WAYL_WEBHOOK_SECRET|GOOGLE_GENERATIVE_AI_API_KEY|OPENAI_API_KEY|META_CONVERSIONS_ACCESS_TOKEN|TIKTOK_EVENTS_ACCESS_TOKEN|UPSTASH_REDIS_REST_TOKEN|ARCJET_KEY|BETTERSTACK_API_KEY|FCM_SERVICE_ACCOUNT|PUSH_WEBHOOK_SECRET|BOXY_API_SECRET|BOXY_WEBHOOK_SECRET" $dirs; then
            echo "A secret name or value reached a client bundle."
            exit 1
          fi

  database:
    name: Database (migrations, RLS, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Start Supabase (applies migrations and seed; Mailpit catches the email codes)
        working-directory: packages/database
        run: bunx supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,realtime,postgres-meta
      - name: Lint schema
        working-directory: packages/database
        run: bunx supabase db lint --level warning --fail-on warning
      - name: Row Level Security, structure and advisor tests (pgTAP)
        working-directory: packages/database
        run: bun run db:test
      - name: Generated types are up to date
        run: |
          (cd packages/database && bunx supabase gen types typescript --local --schema public) \
            | bunx biome format --stdin-file-path=packages/database/types.ts > "$RUNNER_TEMP/types.ts"
          diff -u packages/database/types.ts "$RUNNER_TEMP/types.ts" \
            || (echo "Run 'bun run db:types' and commit the result." && exit 1)
      - name: Integration tests (auth, billing, storage)
        run: |
          eval "$(cd packages/database && bunx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY|MAILPIT_URL)=' | sed 's/^/export /')"
          SUPABASE_INTEGRATION=1 bunx turbo test --force --filter=@repo/auth --filter=@repo/payments --filter=@repo/storage

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Start Supabase (Auth, REST, Storage and Mailpit, which catches the email codes)
        working-directory: packages/database
        run: bunx supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,realtime,postgres-meta
      - name: Browsers
        working-directory: apps/e2e
        run: bunx playwright install --with-deps chromium
      # The journeys run against production builds (next start), not the dev
      # servers: faster, and what actually ships.
      - name: Build the website (with The IDEA Pass), The IDEA Partners and the API against the local stack
        run: |
          eval "$(cd packages/database && bunx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=' | sed 's/^/export /')"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          bunx turbo build --filter=partners --filter=staff --filter=web --filter=api
      - name: Journeys (public site, The IDEA Pass sign-up, store, support, Staff) and axe checks
        run: |
          eval "$(cd packages/database && bunx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY|MAILPIT_URL)=' | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL" SUPABASE_SECRET_KEY="$SECRET_KEY" SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          E2E_START=start bun run --cwd apps/e2e e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: apps/e2e/test-results
          retention-days: 7
