name: Send reminders

# Review requests (3 days after delivery) and cart reminders (24 hours
# after a cart is left) go out hourly from here, and daily by Vercel Cron.
# Needs the repository secret CRON_SECRET (the same value as the API
# project's); without it the job does nothing.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send what's due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://api.theideaiq.com/cron/reminders"
