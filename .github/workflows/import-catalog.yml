name: Import the catalog into production

# Loads the product catalog in packages/database/supabase/catalog/statements
# into the production database, one statement per file, in order. Data only
# (categories and products), never schema; every statement is an idempotent
# upsert, so running it again updates names, descriptions, prices and
# pictures but keeps stock, status and featured flags set in the back office.
# Run it by hand: Actions → "Import the catalog into production" → Run.
# Uses the same `production` environment secrets as migrate.yml.

on:
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    name: Import catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD to the production environment and the SUPABASE_PROJECT_REF variable."
            exit 1
          fi
      - name: Link the project
        working-directory: packages/database
        run: bunx supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Import
        working-directory: packages/database
        run: |
          set -euo pipefail
          for file in supabase/catalog/statements/*.sql; do
            echo "::group::$file"
            bunx supabase db query --linked -f "$file"
            echo "::endgroup::"
          done
      - name: Count
        working-directory: packages/database
        run: bunx supabase db query --linked "select status, count(*) from public.products group by status order by status"
