<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0f1014" />
    <title>Spark Catcher · The IDEA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="ui" aria-live="polite">
      <div id="score">0</div>
      <div id="energy-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
        <div id="energy-fill"></div>
      </div>
      <div id="best"></div>
    </div>

    <div id="overlay" class="visible">
      <h1 id="title">Spark Catcher</h1>
      <p id="message"></p>
      <p id="final"></p>
      <button id="start" type="button"></button>
    </div>

    <canvas id="game"></canvas>

    <script src="./game.js"></script>
  </body>
</html>
