<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8">
    <meta
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
      name="viewport"
    >
    <meta content="noindex" name="robots">
    <meta content="#0f1014" name="theme-color">
    <title>Spark Catcher · The IDEA</title>
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="./style.css" rel="stylesheet">
  </head>
  <body>
    <div aria-live="polite" id="ui">
      <div id="score">0</div>
      <div
        aria-valuemax="100"
        aria-valuemin="0"
        aria-valuenow="100"
        id="energy-bar"
        role="progressbar"
      >
        <div id="energy-fill"></div>
      </div>
      <div id="best"></div>
    </div>

    <div class="visible" id="overlay">
      <h1 id="title">Spark Catcher</h1>
      <p id="message"></p>
      <p id="final"></p>
      <button id="start" type="button"></button>
    </div>

    <canvas id="game"></canvas>

    <script defer src="./game.js"></script>
  </body>
</html>
