<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8">
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    >
    <meta content="dark" name="color-scheme">
    <meta content="#d81b60" name="theme-color">
    <title>The IDEA</title>
    <!--
      Bundled into the iOS/Android apps (capacitor.config.ts → errorPath).
      Shown when The IDEA can't be loaded. No network, no plugins on
      Android: everything is inline. Text and the site URL come from
      shell.js (generated by native/prepare.ts from the messages files); the
      defaults below are used when it is missing.
    -->
    <style>
    :root {
      /* The IDEA brand v1.0: white text and a yellow button on pink. */
      --background: #d81b60;
      --foreground: #ffffff;
      --muted: #ffffff;
      --brand: #f4cf08;
      --brand-foreground: #0f1014;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      font-family:
        Alexandria, system-ui, -apple-system, "Segoe UI", "Noto Sans Arabic",
        sans-serif;
      color: var(--foreground);
      text-align: center;
      background: var(--background);
    }
    main {
      max-width: 22rem;
    }
    img {
      width: 72px;
      height: 72px;
      margin-block-end: 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.375rem;
    }
    p {
      margin: 0 0 24px;
      line-height: 1.6;
      color: var(--muted);
    }
    button {
      min-height: 48px;
      padding-inline: 32px;
      font: inherit;
      font-weight: 600;
      color: var(--brand-foreground);
      background: var(--brand);
      border: 0;
      border-radius: 999px;
    }
    button:active {
      opacity: 0.8;
    }
    #status {
      min-height: 1.5em;
      margin-block-start: 16px;
      font-size: 0.875rem;
    }
    </style>
  </head>
  <body>
    <main>
      <img alt="" src="logo.svg">
      <h1 id="title">أنت غير متصل</h1>
      <p id="description">
        يحتاج The IDEA إلى اتصال بالإنترنت. تحقّق من شبكة Wi-Fi أو بيانات الهاتف
        ثم أعد المحاولة.
      </p>
      <button id="retry" type="button">أعد المحاولة</button>
      <p aria-live="polite" id="status" role="status"></p>
    </main>
    <script defer src="shell.js"></script>
    <script defer src="offline.js"></script>
  </body>
</html>
